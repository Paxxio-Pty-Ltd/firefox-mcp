name: Feature request
description: Something the tools should do, or do with fewer calls or tokens.
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: The real task, not the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Where did the current tools get in the way?
      description: The calls you made and what went wrong, e.g. "reading the result banner took a scroll and a screenshot".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would fix it?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked ROADMAP.md and existing issues.
          required: true
